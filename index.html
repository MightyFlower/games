<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Invitation — Bagus & Bunga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-card {
            background: rgba(30, 27, 75, 0.75);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(244, 63, 94, 0.4);
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
            50% { box-shadow: 0 0 45px rgba(255, 42, 95, 0.85); }
        }
        .glow-spicy { animation: pulseGlow 2.5s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <div class="fixed inset-0 z-0 pointer-events-none opacity-20 bg-cover bg-center" style="background-image: url('background.jpg');"></div>
    <div class="fixed inset-0 z-0 pointer-events-none bg-gradient-to-br from-slate-950 via-rose-950/60 to-indigo-950"></div>

    <!-- MAIN CONTAINER -->
    <div class="relative z-10 max-w-md w-full glass-card rounded-3xl p-6 sm:p-8 text-center space-y-6 shadow-2xl glow-spicy border border-romantic-500/50">
        
        <!-- SCREEN 0: ROLE SELECTION (Tampilan Awal Pilih Peran) -->
        <div id="screenRole" class="space-y-6 py-4">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-600 to-pink-500 mx-auto flex items-center justify-center text-3xl shadow-xl shadow-rose-600/40 animate-bounce">
                🍷
            </div>
            <div class="space-y-2">
                <h1 class="font-serif text-3xl font-bold bg-gradient-to-r from-romantic-300 via-pink-300 to-rose-400 bg-clip-text text-transparent">Special Invitation</h1>
                <p class="text-xs text-slate-300">Silakan pilih peranmu untuk melanjutkan:</p>
            </div>
            <div class="space-y-3 pt-2">
                <button onclick="selectRole('bagus')" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-slate-800 hover:from-indigo-500 hover:to-slate-700 text-white font-bold text-sm shadow-lg transition flex items-center justify-center space-x-2 cursor-pointer">
                    <span>👨‍💻</span><span>Masuk Sebagai Bagus (Lihat Hasil)</span>
                </button>
                <button onclick="selectRole('bunga')" class="w-full py-4 rounded-2xl bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-bold text-sm shadow-xl shadow-rose-600/40 transition flex items-center justify-center space-x-2 cursor-pointer">
                    <span>👩</span><span>Masuk Sebagai Bunga (Mulai Cerita)</span>
                </button>
            </div>
        </div>

        <!-- SCREEN BAGUS: VIEW BAGUS (Hanya Menampilkan Status Hasil) -->
        <div id="screenBagus" class="space-y-6 hidden py-2">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <button onclick="backToRoleSelect()" class="text-xs text-slate-400 hover:text-white">⬅️ Ganti Peran</button>
                <span class="text-xs font-bold text-rose-300">👨‍💻 Dashboard Bagus</span>
                <button onclick="toggleConfig()" class="text-xs text-slate-400 hover:underline">⚙️ DB</button>
            </div>

            <!-- Firebase Config Box (Hidden by default) -->
            <div id="configBox" class="hidden bg-slate-900 p-3 rounded-xl text-left space-y-1.5 text-[11px]">
                <label class="font-bold text-slate-300">Firebase URL:</label>
                <input type="text" id="firebaseUrlInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-white outline-none">
                <button onclick="saveFirebaseUrl()" class="w-full py-1.5 bg-rose-600 text-white font-bold rounded-lg">Simpan</button>
            </div>

            <div class="space-y-2">
                <div class="inline-flex items-center space-x-2 bg-rose-500/20 px-3 py-1 rounded-full text-rose-300 text-xs font-semibold">
                    <span>⏳</span>
                    <span>Memantau Respons Bunga</span>
                </div>
                <h2 class="font-serif text-2xl font-bold">Status Undangan Dinner Sabtu Ini</h2>
            </div>

            <div id="bagusStatusBox" class="bg-slate-950/90 p-6 rounded-2xl border border-rose-500/40 space-y-3 shadow-inner">
                <div class="text-xs text-slate-400 uppercase tracking-widest font-bold">Hasil Respons:</div>
                <div id="bagusStatusText" class="text-xl font-serif font-bold text-amber-300 animate-pulse">Menunggu Jawaban Bunga... ⏳</div>
            </div>
            
            <button onclick="resetDinnerStatus()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-700 transition cursor-pointer">
                🔄 Reset Status (Untuk Tes Sebelum Kirim ke Bunga)
            </button>
            
            <p class="text-[11px] text-slate-400 italic">Halaman ini akan otomatis berubah begitu Bunga menekan tombol YES di HP-nya! 🚀</p>
        </div>

        <!-- SCREEN BUNGA: STORY NARRATIVE SLIDER (Next Next Next + Spicy Compliment) -->
        <div id="screenBunga" class="space-y-6 hidden py-2 text-left">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <button onclick="backToRoleSelect()" class="text-xs text-slate-400 hover:text-white">⬅️ Kembali</button>
                <span id="slideIndicator" class="text-xs font-bold text-pink-300">Bagian 1 dari 5</span>
                <div></div>
            </div>

            <!-- Narrative Slides -->
            <div id="slideContent" class="space-y-4 min-h-[200px] flex flex-col justify-center">
                <!-- Injected via JS -->
            </div>

            <!-- Slide Navigation Buttons -->
            <div class="flex gap-3 pt-2">
                <button onclick="prevSlide()" id="prevBtn" class="hidden px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition cursor-pointer">
                    ⬅️ Sebelumnya
                </button>
                <button onclick="nextSlide()" id="nextBtn" class="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-extrabold text-sm shadow-lg shadow-rose-600/40 transition cursor-pointer">
                    Lanjut ❤️ ➡️
                </button>
            </div>
        </div>

    </div>

    <script>
        let defaultDbUrl = localStorage.getItem('fb_dinner_url') || 'https://romantic-dinner-b1837-default-rtdb.asia-southeast1.firebasedatabase.app';
        document.getElementById('firebaseUrlInput').value = defaultDbUrl;

        function toggleConfig() {
            const box = document.getElementById('configBox');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function saveFirebaseUrl() {
            const url = document.getElementById('firebaseUrlInput').value.trim();
            if (url) {
                localStorage.setItem('fb_dinner_url', url);
                defaultDbUrl = url;
                alert("✅ URL Firebase tersimpan!");
                toggleConfig();
            }
        }

        function selectRole(role) {
            document.getElementById('screenRole').classList.add('hidden');
            if (role === 'bagus') {
                document.getElementById('screenBagus').classList.remove('hidden');
                startBagusPolling();
            } else {
                document.getElementById('screenBunga').classList.remove('hidden');
                currentSlide = 0;
                renderSlide();
            }
        }

        function backToRoleSelect() {
            document.getElementById('screenBagus').classList.add('hidden');
            document.getElementById('screenBunga').classList.add('hidden');
            document.getElementById('screenRole').classList.remove('hidden');
            stopBagusPolling();
        }

        // --- STORY NARRATIVE FOR BUNGA ---
        let currentSlide = 0;
        const slides = [
            {
                tag: "💖 Untuk Bunga Tersayang",
                title: "Hai sayangku...",
                text: "Malam ini aku lagi mikirin kamu, mikirin gimana senyum kamu selalu berhasil bikin hari-hariku jadi jauh lebih hangat dan berarti."
            },
            {
                tag: "✨ Ikatan Kita",
                title: "Setiap detik bareng kamu...",
                text: "Entah pas kita lagi ketawa bareng, ngobrolin banyak hal random, atau pas lagi pelukan erat, semuanya selalu jadi momen paling nyaman di hidupku."
            },
            {
                tag: "🔥 Pesona & Keintiman",
                title: "Dan jujur ya sayang...",
                text: "Setiap kali aku lihat kamu dekat, aku selalu terpesona sama bentuk badanmu yang super seksi, lekuk tubuhmu yang pas di pelukan, dan pesona kamu yang bener-bener bikin aku tergila-gila tiap detik..."
            },
            {
                tag: "🍷 Rencana Spesial",
                title: "Makanya...",
                text: "Aku udah nyiapin satu malam spesial buat kita berdua khusus di hari Sabtu besok. Waktunya kita nikmati waktu berkualitas tanpa gangguan."
            },
            {
                tag: "🌹 Undangan Resmi",
                title: "Maukah kamu dinner bareng aku sabtu malam ini?",
                text: "Tempat cozy, makanan enak, dan pelukan hangat udah menanti kita berdua. Klik tombol di bawah kalau kamu mau ya sayang! ❤️",
                isFinal: true
            }
        ];

        function renderSlide() {
            const content = document.getElementById('slideContent');
            const indicator = document.getElementById('slideIndicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            indicator.innerText = `Bagian ${currentSlide + 1} dari ${slides.length}`;
            const s = slides[currentSlide];

            if (currentSlide === 0) prevBtn.classList.add('hidden');
            else prevBtn.classList.remove('hidden');

            if (s.isFinal) {
                nextBtn.classList.add('hidden');
                content.innerHTML = `
                    <div class="text-center space-y-4 py-2">
                        <span class="px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 text-xs font-semibold border border-rose-500/40">${s.tag}</span>
                        <h3 class="font-serif text-2xl font-bold text-romantic-300">${s.title}</h3>
                        <p class="text-xs text-slate-300 leading-relaxed">${s.text}</p>
                        <div class="pt-4 space-y-3">
                            <button onclick="respondYes()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm shadow-xl shadow-emerald-600/40 transition transform hover:scale-105 cursor-pointer">
                                ✨ YES! Mau Banget Dinner Bareng Kamu ❤️
                            </button>
                        </div>
                    </div>
                `;
            } else {
                nextBtn.classList.remove('hidden');
                nextBtn.innerText = "Lanjut ❤️ ➡️";
                content.innerHTML = `
                    <div class="space-y-3 py-2 text-center">
                        <span class="inline-block px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 text-xs font-semibold border border-rose-500/40">${s.tag}</span>
                        <h3 class="font-serif text-2xl font-bold text-slate-100">${s.title}</h3>
                        <p class="text-xs text-slate-300 leading-relaxed bg-slate-950/80 p-4 rounded-2xl border border-slate-800">${s.text}</p>
                    </div>
                `;
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        async function respondYes() {
            const payload = { status: 'YES', time: new Date().toISOString() };
            try {
                await fetch(`${defaultDbUrl}/dinner_response.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                confetti({ particleCount: 180, spread: 110, origin: { y: 0.5 } });
                alert("💖 YEEES! Berhasil terkirim ke Bagus! Siap-siap Saturday night date ya sayang! 🥂");
            } catch(e) {
                localStorage.setItem('dinner_fallback_yes', 'YES');
                confetti({ particleCount: 180, spread: 110, origin: { y: 0.5 } });
                alert("💖 Tersimpan (Local Fallback)! Berhasil terkirim ke Bagus! 🥂");
            }
        }

        // --- BAGUS POLLING ---
        let pollingInterval = null;

        function startBagusPolling() {
            checkBagusStatus();
            pollingInterval = setInterval(checkBagusStatus, 1500);
        }

        function stopBagusPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
        }

        
        async function resetDinnerStatus() {
            const payload = { status: 'PENDING', time: new Date().toISOString() };
            try {
                await fetch(`${defaultDbUrl}/dinner_response.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                localStorage.removeItem('dinner_fallback_yes');
                const statusBox = document.getElementById('bagusStatusBox');
                const statusText = document.getElementById('bagusStatusText');
                statusBox.className = "bg-slate-950/90 p-6 rounded-2xl border border-rose-500/40 space-y-3 shadow-inner";
                statusText.className = "text-xl font-serif font-bold text-amber-300 animate-pulse";
                statusText.innerHTML = "Menunggu Jawaban Bunga... ⏳";
                alert("🔄 Status berhasil di-reset ke 'Menunggu'! Siap ditest.");
            } catch(e) {
                alert("Gagal mereset status: " + e);
            }
        }

        async function checkBagusStatus() {
            const statusBox = document.getElementById('bagusStatusBox');
            const statusText = document.getElementById('bagusStatusText');
            try {
                const res = await fetch(`${defaultDbUrl}/dinner_response.json`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.status === 'YES') {
                        statusBox.className = "bg-emerald-950/90 p-6 rounded-2xl border border-emerald-500/50 space-y-3 shadow-lg";
                        statusText.className = "text-xl font-serif font-bold text-emerald-300";
                        statusText.innerHTML = "🎉 Bunga MENJAWAB: YES! MAU BANGET! ❤️🥂";
                    }
                }
            } catch(e) {
                if (localStorage.getItem('dinner_fallback_yes') === 'YES') {
                    statusBox.className = "bg-emerald-950/90 p-6 rounded-2xl border border-emerald-500/50 space-y-3 shadow-lg";
                    statusText.className = "text-xl font-serif font-bold text-emerald-300";
                    statusText.innerHTML = "🎉 Bunga MENJAWAB: YES! MAU BANGET! ❤️🥂";
                }
            }
        }
    </script>
</body>
</html>
